<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-container">
        <div class="date" id="date-display">Monday, Jan 01, 2026</div>
        <div class="time-wrapper">
            <div class="time" id="clock-display">12:00:00</div>
            <div class="format" id="format-display">AM</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
